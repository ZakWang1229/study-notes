<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif">
  <title>琴生不等式几何意义示意</title>
  <rect width="720" height="500" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">琴生不等式（Jensen）几何意义 · 示意</text>

  <line x1="60" y1="420" x2="660" y2="420" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="360" y1="60" x2="360" y2="440" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="660" y="440" font-size="13" fill="#6b7280">x</text>
  <text x="374" y="68" font-size="13" fill="#6b7280">y</text>
  <text x="352" y="436" font-size="11" fill="#9ca3af">O</text>

  <polyline points="60,60 110,170 160,260 210,330 260,380 310,410 360,420 410,410 460,380 510,330 560,260 610,170 660,60" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="612" y="98" font-size="14" fill="#2563eb">f(x) = x²</text>

  <circle cx="110" cy="170" r="5" fill="#dc2626"/>
  <circle cx="510" cy="330" r="5" fill="#dc2626"/>
  <text x="62" y="150" font-size="13" fill="#dc2626">A(x₁, f(x₁))</text>
  <text x="516" y="312" font-size="13" fill="#dc2626">B(x₂, f(x₂))</text>

  <line x1="110" y1="170" x2="510" y2="330" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="255" y="252" font-size="12" fill="#b91c1c">弦：两端点连线</text>

  <circle cx="310" cy="250" r="5" fill="#d97706"/>
  <text x="322" y="240" font-size="13" fill="#b45309">D((x₁+x₂)/2, (f(x₁)+f(x₂))/2)</text>

  <circle cx="310" cy="410" r="5" fill="#16a34a"/>
  <text x="120" y="436" font-size="13" fill="#15803d">C((x₁+x₂)/2, f((x₁+x₂)/2))</text>

  <line x1="310" y1="250" x2="310" y2="410" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="360" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">弦中点 D 高于曲线上对应点 C ⇒ f((x₁+x₂)/2) ≤ (f(x₁)+f(x₂))/2（凸函数）</text>
</svg>
