<text x="518.0" y="76" font-size="14" font-weight="bold" fill="#333">图例</text>
<line x1="518.0" y1="94" x2="590.0" y2="94" stroke="#2563eb" stroke-width="2.6"/>
<text x="606.0" y="99" font-size="13" fill="#333">(1+x)ⁿ（n=2、3，实线）</text>
<line x1="518.0" y1="116" x2="590.0" y2="116" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
<text x="606.0" y="121" font-size="13" fill="#333">切线 y=1+nx（虚线）</text>
<line x1="518.0" y1="138" x2="590.0" y2="138" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="606.0" y="143" font-size="13" fill="#333">y=1+x（n=1 基准线）</text>
<text x="450.0" y="568" text-anchor="middle" font-size="14" fill="#333">结论：对 x &gt; -1，幂函数曲线 (1+x)ⁿ 始终位于其切线 y=1+nx 上方；n≥2 时等号仅当 x=0。</text>
<text x="450.0" y="592" text-anchor="middle" font-size="14" fill="#333">n 越大，曲线远离切线越快——这正是复利增长快于单利的几何来源。</text>
